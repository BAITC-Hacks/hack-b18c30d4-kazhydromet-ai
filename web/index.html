<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ГосФин — AI-помощник по финансовым госуслугам</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
<header class="bg-slate-900 text-white">
  <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between gap-4">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-lg bg-emerald-500 grid place-items-center font-bold">Г</div>
      <div><div class="font-semibold">ГосФин</div><div class="text-xs text-slate-400">AI-помощник по финансовым госуслугам</div></div>
    </div>
    <span id="mode" class="text-xs px-2 py-1 rounded bg-slate-700">…</span>
  </div>
</header>

<main class="max-w-7xl mx-auto px-4 py-6 grid gap-6 lg:grid-cols-5">
  <section class="lg:col-span-3 space-y-6">
    <div class="bg-white rounded-xl shadow-sm px-4 py-3 flex flex-wrap items-center gap-x-3 gap-y-2 text-sm">
      <span class="font-medium">Данные:</span>
      <span id="ds" class="text-slate-500">загружаю…</span>
      <label class="ml-auto text-emerald-700 hover:underline cursor-pointer">
        Загрузить CSV или Excel<input id="up" type="file" accept=".csv,.xlsx,.xls" class="hidden">
      </label>
      <button id="rst" class="text-slate-400 hover:text-slate-700 hover:underline">вернуть демо</button>
    </div>
    <div id="kpis" class="grid grid-cols-2 md:grid-cols-4 gap-3"></div>
    <div class="bg-white rounded-xl shadow-sm p-4">
      <h2 class="font-semibold mb-3">Суммы по типам услуг</h2>
      <canvas id="chart" height="140"></canvas>
    </div>
    <div class="bg-white rounded-xl shadow-sm p-4 overflow-x-auto">
      <h2 class="font-semibold mb-3">Требует проверки <span class="text-xs text-slate-400">(дубли, просрочки, отказы)</span></h2>
      <table class="w-full text-sm [&_td]:pr-4 [&_th]:pr-4"><thead class="text-left text-slate-500"><tr>
        <th class="py-1">Дата</th><th>ИИН</th><th>Услуга</th><th>Сумма</th><th>Регион</th><th>Причина</th></tr></thead>
        <tbody id="anoms"></tbody></table>
    </div>
  </section>

  <section class="lg:col-span-2 bg-white rounded-xl shadow-sm flex flex-col h-[80vh] lg:sticky lg:top-4">
    <div class="p-4 border-b font-semibold">Чат с агентом</div>
    <div id="log" class="flex-1 overflow-y-auto p-4 space-y-3 text-sm"></div>
    <div class="px-4 pb-2 flex flex-wrap gap-2" id="hints"></div>
    <form id="f" class="p-4 border-t flex gap-2">
      <input id="q" class="flex-1 border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-500" placeholder="Спроси про начисления и выплаты…" autocomplete="off">
      <button class="bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg px-4">→</button>
    </form>
  </section>
</main>

<script>
const $ = s => document.querySelector(s);
const fmt = n => new Intl.NumberFormat('ru-RU').format(n);
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const history = [];

async function load() {
  const [h, s, a, d] = await Promise.all(['/api/health', '/api/summary', '/api/anomalies', '/api/dataset'].map(u => fetch(u).then(r => r.json())));
  showDataset(d);
  $('#mode').textContent = h.live ? `LIVE · ${h.model}` : 'DEMO · без ключа';
  $('#mode').className = 'text-xs px-2 py-1 rounded ' + (h.live ? 'bg-emerald-600' : 'bg-amber-600');
  $('#kpis').innerHTML = [
    ['Записей', fmt(s.documents)], ['Общая сумма', fmt(s.total_kzt) + ' ₸'],
    ['Граждан', fmt(s.citizens)], ['Просрочено', fmt(s.overdue)],
  ].map(([k, v]) => `<div class="bg-white rounded-xl shadow-sm p-4"><div class="text-xs text-slate-500">${k}</div><div class="text-xl font-semibold mt-1">${v}</div></div>`).join('');
  new Chart($('#chart'), {
    type: 'bar',
    data: { labels: Object.keys(s.by_type), datasets: [{ data: Object.values(s.by_type), backgroundColor: '#10b981', borderRadius: 6 }] },
    options: { indexAxis: 'y', plugins: { legend: { display: false } }, scales: { x: { ticks: { callback: v => fmt(v) } } } },
  });
  $('#anoms').innerHTML = a.map(t => `<tr class="border-t align-top"><td class="py-1 whitespace-nowrap">${t.date.slice(0, 10).split('-').reverse().join('.')}</td>
    <td class="whitespace-nowrap">${t.iin}</td><td>${esc(t.service)}</td>
    <td class="font-medium text-rose-600 whitespace-nowrap">${fmt(t.amount_kzt)} ₸</td><td>${esc(t.region)}</td>
    <td class="text-slate-500">${esc(t.flag_reason)}</td></tr>`).join('');
}

function showDataset(d) {
  $('#ds').innerHTML = d.error ? `<span class="text-rose-600">${esc(d.error)}</span>`
    : `<b>${esc(d.source)}</b> · ${fmt(d.rows)} строк · ${d.columns.length} колонок: <span class="text-slate-400">${d.columns.map(c => esc(c.name)).join(', ')}</span>`;
}

$('#up').onchange = async e => {
  const file = e.target.files[0];
  if (!file) return;
  $('#ds').textContent = 'загружаю ' + file.name + '…';
  const body = new FormData();
  body.append('file', file);
  const r = await fetch('/api/dataset/upload', { method: 'POST', body });
  const d = await r.json();
  showDataset(r.ok ? d : { error: d.detail || 'не удалось прочитать файл' });
  if (r.ok) bubble('assistant', `Загрузил <b>${esc(d.source)}</b>: ${fmt(d.rows)} строк. Спрашивай про эти данные — я вижу их колонки.`);
  e.target.value = '';
};

$('#rst').onclick = async () => showDataset(await fetch('/api/dataset/reset', { method: 'POST' }).then(r => r.json()));

function bubble(role, html) {
  const el = document.createElement('div');
  el.className = role === 'user' ? 'ml-auto max-w-[85%] bg-emerald-600 text-white rounded-2xl rounded-br-sm px-3 py-2'
                                 : 'max-w-[90%] bg-slate-100 rounded-2xl rounded-bl-sm px-3 py-2';
  el.innerHTML = html;
  $('#log').append(el);
  $('#log').scrollTop = 1e9;
  return el;
}

async function send(text) {
  bubble('user', esc(text));
  history.push({ role: 'user', content: text });
  const wait = bubble('assistant', '<span class="animate-pulse text-slate-400">Агент думает…</span>');
  try {
    const r = await fetch('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ messages: history }) }).then(r => r.json());
    history.push({ role: 'assistant', content: r.reply });
    const trace = r.trace.map(t => `<span class="inline-block text-[11px] bg-white border rounded px-1.5 py-0.5 mr-1 mb-1" title="${esc(t.args)}">🔧 ${esc(t.tool)}</span>`).join('');
    wait.innerHTML = (trace ? `<div class="mb-1">${trace}</div>` : '') + esc(r.reply).replace(/\n/g, '<br>');
  } catch (e) {
    wait.innerHTML = '<span class="text-rose-600">Ошибка связи с сервером</span>';
  }
}

$('#f').onsubmit = e => { e.preventDefault(); const q = $('#q').value.trim(); if (q) { $('#q').value = ''; send(q); } };
['Что требует проверки в первую очередь?', 'Профиль гражданина 990007300007', 'Где чаще всего отказывают в выплатах?', 'Просроченные налоги крупнее 300 000 ₸']
  .forEach(h => { const b = document.createElement('button'); b.className = 'text-xs border rounded-full px-3 py-1 hover:bg-slate-100'; b.textContent = h; b.onclick = () => send(h); $('#hints').append(b); });
bubble('assistant', 'Привет! Я помощник по финансовым госуслугам. Спроси про начисления, выплаты, просрочки или отказы.');
load();
</script>
</body>
</html>
